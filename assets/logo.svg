<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="useragent404 — offensive security field manual">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8b8"/>
      <stop offset="1" stop-color="#8fd6e4"/>
    </linearGradient>
    <style>
      .wm{font-family:'JetBrains Mono','Liberation Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700}
      .meta{font-family:'JetBrains Mono','Liberation Mono',ui-monospace,monospace;font-weight:400;letter-spacing:2px}
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="198" rx="22" fill="#0b1110" stroke="#1d2a24" stroke-width="2"/>

  <!-- badge -->
  <g transform="translate(44,40) scale(1.875)">
    <rect x="3" y="3" width="58" height="58" rx="15" fill="#080d0b"/>
    <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="14.25" fill="none" stroke="url(#g)" stroke-opacity="0.35" stroke-width="1.25"/>
    <g fill="none" stroke="url(#g)" stroke-opacity="0.65" stroke-width="2.4" stroke-linecap="round">
      <path d="M18 17 H12 V47 H18"/><path d="M46 17 H52 V47 H46"/>
    </g>
    <g class="wm" text-anchor="middle" fill="url(#g)">
      <text x="32" y="26" font-size="16" letter-spacing="-.5">UA</text>
      <text x="32" y="47" font-size="21" letter-spacing="-1.5" textLength="30" lengthAdjust="spacingAndGlyphs">404</text>
    </g>
  </g>

  <!-- wordmark -->
  <text class="wm" x="214" y="96" font-size="48" letter-spacing="-1" fill="#dce6df">useragent<tspan fill="url(#g)">404</tspan></text>

  <!-- metadata -->
  <circle cx="221" cy="128" r="6" fill="#9fe8b8"/>
  <text class="meta" x="238" y="134" font-size="17" fill="#7e9088">UID 0x404</text>
  <text class="meta" x="238" y="134" font-size="17" fill="#55655d" dx="118">·   DXB   ·   OFFENSIVE SECURITY</text>

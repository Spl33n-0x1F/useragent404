<title>CPTS Field Manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: fixed terminal sidebar (searchable TOC) + reading column; sticky command bar on top */
:root{
  --bg:#f7f8f4; --panel:#ffffff; --panel2:#eef2ea; --fg:#232b28; --muted:#6a766f;
  --border:#e4e8e0; --accent:#2f8f63; --accent2:#2d8aa3; --on-accent:#ffffff;
  --code-bg:#12211c; --code-fg:#dbe6df; --mark:#cfeedb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --panel:#141c19; --panel2:#19221e; --fg:#d9e2dc; --muted:#8a978f;
  --border:#243029; --accent:#a3e8bb; --accent2:#93d6e2; --on-accent:#06241a;
  --code-bg:#0b110f; --code-fg:#cfe0d6; --mark:#2f4738; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1512; --panel:#141c19; --panel2:#19221e; --fg:#d9e2dc; --muted:#8a978f;
  --border:#243029; --accent:#a3e8bb; --accent2:#93d6e2; --on-accent:#06241a;
  --code-bg:#0b110f; --code-fg:#cfe0d6; --mark:#2f4738; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:"Hanken Grotesk",Inter,system-ui,sans-serif;margin:0;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* command bar */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;gap:.6rem;align-items:center;
  padding:.6rem clamp(.8rem,2vw,1.1rem);background:var(--panel);border-bottom:1px solid var(--border)}
#bar .brand{font-family:"JetBrains Mono",monospace;font-weight:700;color:var(--accent);white-space:nowrap;font-size:.95rem}
#bar .brand .dim{color:var(--muted);font-weight:400}
#search{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--border);color:var(--fg);
  font-family:"JetBrains Mono",monospace;font-size:.85rem;padding:.5rem .7rem;border-radius:7px}
#search::placeholder{color:var(--muted)}
.iconbtn{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:7px;
  width:38px;height:38px;cursor:pointer;font-size:1rem;display:grid;place-items:center;flex:none}
.iconbtn:hover{border-color:var(--accent)}
#menuBtn{display:none}

/* shell */
#shell{display:flex;max-width:1500px;margin:0 auto;min-height:100vh}
#side{width:310px;flex:none;border-right:1px solid var(--border);background:var(--panel);
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 51px);align-self:flex-start;
  height:calc(100vh - 51px);overflow-y:auto;padding:1rem .5rem 3rem}
#side h4{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:1rem .7rem .3rem}
.toc a{display:block;color:var(--fg);font-size:.86rem;padding:.3rem .7rem;border-radius:6px;border-left:2px solid transparent}
.toc a.lvl3{padding-left:1.5rem;font-size:.8rem;color:var(--muted)}
.toc a:hover{background:var(--panel2);text-decoration:none}
.toc a.active{color:var(--accent);border-left-color:var(--accent);background:var(--panel2)}
.toc a.hide{display:none}

/* main */
#main{flex:1;min-width:0;padding:clamp(1.2rem,3vw,2.4rem) clamp(1rem,3vw,2.6rem) 5rem;max-width:62rem}
#main h1{font-family:"Hanken Grotesk",Inter,sans-serif;font-weight:800;letter-spacing:-.025em;
  font-size:clamp(1.65rem,4vw,2.2rem);color:var(--accent);
  text-wrap:balance;margin:.2rem 0 .3rem;border-bottom:1px solid var(--border);padding-bottom:.7rem}
#main h2{font-family:"Hanken Grotesk",Inter,sans-serif;font-weight:700;letter-spacing:-.015em;font-size:1.4rem;
  margin:2.6rem 0 .8rem;scroll-margin-top:72px;padding-top:.7rem;border-top:1px solid var(--border);color:var(--fg)}
#main h2::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:2px;
  background:var(--accent);margin-right:.55rem;vertical-align:middle}
#main h3{font-family:"Hanken Grotesk",Inter,sans-serif;font-weight:700;letter-spacing:-.01em;font-size:1.08rem;
  margin:1.7rem 0 .5rem;scroll-margin-top:72px;color:var(--accent2)}
#main h4{font-size:.95rem;margin:1.1rem 0 .4rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
#main p{margin:.5rem 0}
#main ul,#main ol{padding-left:1.3rem}
#main li{margin:.25rem 0}
#main blockquote{margin:.8rem 0;padding:.6rem .9rem;background:var(--panel2);border-left:3px solid var(--accent);
  border-radius:0 7px 7px 0;color:var(--muted);font-size:.92rem}
#main blockquote strong{color:var(--fg)}
#main hr{border:none;border-top:1px dashed var(--border);margin:2rem 0}
#main img{max-width:100%}
code{font-family:"JetBrains Mono",monospace;font-size:.86em}
:not(pre)>code{background:var(--panel2);color:var(--accent);padding:.12em .4em;border-radius:5px;
  border:1px solid var(--border);word-break:break-word}
.codewrap{position:relative;margin:.7rem 0}
pre{background:var(--code-bg);color:var(--code-fg);padding:.9rem 1rem;border-radius:9px;overflow-x:auto;
  border:1px solid var(--border);margin:0;font-size:.82rem;line-height:1.55}
pre code{color:inherit}
.copy{position:absolute;top:.45rem;right:.45rem;background:#1b2a2e;color:var(--code-fg);border:1px solid #2b3d41;
  font-family:"JetBrains Mono",monospace;font-size:.68rem;padding:.25rem .5rem;border-radius:6px;cursor:pointer;opacity:.75}
.copy:hover{opacity:1;border-color:var(--accent)}
.copy.ok{color:var(--accent);border-color:var(--accent)}

/* tables */
.tablewrap{overflow-x:auto;margin:.8rem 0;border:1px solid var(--border);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:min(100%,560px)}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--panel2);font-family:"JetBrains Mono",monospace;font-size:.72rem;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);position:sticky;top:0}
tr:last-child td{border-bottom:none}
td code{white-space:nowrap}
mark{background:var(--mark);color:inherit;border-radius:3px}

#backtop{position:fixed;right:1rem;bottom:calc(env(safe-area-inset-bottom,0px) + 1rem);z-index:20;
  background:var(--accent);color:var(--on-accent);border:none;border-radius:50%;width:44px;height:44px;cursor:pointer;
  font-size:1.1rem;display:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25}

@media (max-width:860px){
  #menuBtn{display:grid}
  #side{position:fixed;top:0;left:0;height:100%;z-index:26;transform:translateX(-100%);transition:transform .2s;
    width:min(84vw,320px);padding-top:calc(env(safe-area-inset-top,0px) + 1rem)}
  #side.open{transform:none}
  #scrim.open{display:block}
  #main{padding-top:1rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div id="bar">
  <button class="iconbtn" id="menuBtn" aria-label="Menu">&#9776;</button>
  <span class="brand">CPTS<span class="dim">://field-manual</span></span>
  <input id="search" type="search" placeholder="search commands, tools, ports…  (/)" autocomplete="off" spellcheck="false">
  <button class="iconbtn" id="theme" aria-label="Toggle theme" title="Toggle theme">&#9680;</button>
</div>

<div id="shell">
  <nav id="side"><div class="toc" id="toc"></div></nav>
  <main id="main" aria-busy="true"><p style="color:var(--muted);font-family:'JetBrains Mono',monospace">booting field manual…</p></main>
</div>
<div id="scrim"></div>
<button id="backtop" aria-label="Back to top">&#8593;</button>

<script>
(function(){
  "use strict";
  var b64=document.getElementById('doc').textContent.trim();
  var md;
  try{md=new TextDecoder().decode(Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)}));}
  catch(e){md="# Load error\n\nCould not decode the embedded manual.";}

  var main=document.getElementById('main');
  marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});
  var html=marked.parse(md);
  main.innerHTML=html;
  main.removeAttribute('aria-busy');

  // wrap tables + pre for horizontal scroll & copy buttons
  main.querySelectorAll('table').forEach(function(t){
    if(t.parentElement.classList.contains('tablewrap'))return;
    var w=document.createElement('div');w.className='tablewrap';t.parentNode.insertBefore(w,t);w.appendChild(t);
  });
  main.querySelectorAll('pre').forEach(function(p){
    var w=document.createElement('div');w.className='codewrap';p.parentNode.insertBefore(w,p);w.appendChild(p);
    var b=document.createElement('button');b.className='copy';b.type='button';b.textContent='copy';
    b.addEventListener('click',function(){
      var txt=p.innerText;
      function done(){b.textContent='copied';b.classList.add('ok');setTimeout(function(){b.textContent='copy';b.classList.remove('ok')},1200);}
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(done,function(){sel(p);});
      }else{sel(p);}
    });
    w.appendChild(b);
  });
  function sel(node){var r=document.createRange();r.selectNodeContents(node);var s=getSelection();s.removeAllRanges();s.addRange(r);}

  // assign ids + build TOC from h2/h3
  var toc=document.getElementById('toc');
  var heads=main.querySelectorAll('h2,h3');
  var used={};
  var links=[];
  heads.forEach(function(h){
    var slug=h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||'s';
    if(used[slug])slug+='-'+(++used[slug]);else used[slug]=1;
    h.id=slug;
    var a=document.createElement('a');
    a.href='#'+slug;a.textContent=h.textContent.replace(/^#\s*/,'');
    if(h.tagName==='H3')a.className='lvl3';
    a.dataset.text=a.textContent.toLowerCase();
    toc.appendChild(a);
    links.push({a:a,h:h});
  });

  // search: filter TOC entries
  var search=document.getElementById('search');
  search.addEventListener('input',function(){
    var q=search.value.trim().toLowerCase();
    links.forEach(function(o){o.a.classList.toggle('hide', q && o.a.dataset.text.indexOf(q)===-1);});
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus();}
    if(e.key==='Escape'){search.value='';search.dispatchEvent(new Event('input'));search.blur();}
  });

  // scrollspy
  var map={};links.forEach(function(o){map[o.h.id]=o.a;});
  var obs=new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if(en.isIntersecting){
        toc.querySelectorAll('a.active').forEach(function(x){x.classList.remove('active')});
        var a=map[en.target.id];if(a){a.classList.add('active');a.scrollIntoView({block:'nearest'});}
      }
    });
  },{rootMargin:'-60px 0px -75% 0px'});
  heads.forEach(function(h){obs.observe(h);});

  // mobile drawer
  var side=document.getElementById('side'),scrim=document.getElementById('scrim');
  function openSide(v){side.classList.toggle('open',v);scrim.classList.toggle('open',v);}
  document.getElementById('menuBtn').addEventListener('click',function(){openSide(!side.classList.contains('open'));});
  scrim.addEventListener('click',function(){openSide(false);});
  toc.addEventListener('click',function(e){if(e.target.tagName==='A'&&innerWidth<=860)openSide(false);});

  // back to top
  var bt=document.getElementById('backtop');
  addEventListener('scroll',function(){bt.style.display=scrollY>600?'block':'none';});
  bt.addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'});});

  // theme toggle (per-viewer convenience)
  var root=document.documentElement,tb=document.getElementById('theme');
  try{var saved=localStorage.getItem('cpts-theme');if(saved)root.setAttribute('data-theme',saved);}catch(e){}
  tb.addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    var dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    var next=dark?'light':'dark';root.setAttribute('data-theme',next);
    try{localStorage.setItem('cpts-theme',next);}catch(e){}
  });
})();
</script>

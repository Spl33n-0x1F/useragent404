<script>
(function(){
  "use strict";
  var b64=document.getElementById('doc').textContent.trim(),md;
  try{md=new TextDecoder().decode(Uint8Array.from(atob(b64),function(c){return c.charCodeAt(0)}));}
  catch(e){md="# Load error";}
  var content=document.getElementById('doc-content');
  marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});
  content.innerHTML=marked.parse(md);content.removeAttribute('aria-busy');

  // ---- cert coverage tags: parse {{cov:...}} on headings, with module(h1) inheritance ----
  var COVRE=/\s*\{\{cov:([a-z0-9,]+)\}\}/i;
  var curMod='base';
  content.querySelectorAll('h1,h2,h3,h4').forEach(function(h){
    var m=h.textContent.match(COVRE);
    var own=m?m[1].toLowerCase():null;
    if(m)h.innerHTML=h.innerHTML.replace(COVRE,'');
    if(h.tagName==='H1'){curMod=own||'base';h.dataset.cov=curMod;}
    else{h.dataset.cov=own||curMod;}
    if(own&&own!=='base')h.dataset.own=own;
  });

  // wrap tables + add copy buttons
  content.querySelectorAll('table').forEach(function(t){var w=document.createElement('div');w.className='tablewrap';t.parentNode.insertBefore(w,t);w.appendChild(t);});
  content.querySelectorAll('pre').forEach(function(p){
    var w=document.createElement('div');w.className='codewrap';p.parentNode.insertBefore(w,p);w.appendChild(p);
    var b=document.createElement('button');b.className='copy';b.type='button';b.textContent='copy';
    b.addEventListener('click',function(){var txt=p.innerText;
      function done(){b.textContent='copied';b.classList.add('ok');setTimeout(function(){b.textContent='copy';b.classList.remove('ok')},1200);}
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){sel(p);});}else{sel(p);}});
    w.appendChild(b);
  });
  function sel(n){var r=document.createRange();r.selectNodeContents(n);var s=getSelection();s.removeAllRanges();s.addRange(r);}

  // ---- TOC (uses clean heading text, tokens already stripped) ----
  var toc=document.getElementById('toc'),nodes=content.querySelectorAll('h1,h2'),used={};
  function slug(t){var s=t.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||'s';if(used[s])s+='-'+(++used[s]);else used[s]=1;return s;}
  var groups=[],cur=null;
  nodes.forEach(function(h){h.id=slug(h.textContent);
    if(h.tagName==='H1'){cur={h:h,label:h.textContent.split(/\s[\u2014\u2013-]\s/)[0].trim(),kids:[]};groups.push(cur);}
    else if(cur){cur.kids.push({h:h,label:h.textContent.replace(/^[#\s]+/,'')});}});
  var idx={};
  function openGroup(g){toc.querySelectorAll('.grp.open').forEach(function(x){if(x!==g)x.classList.remove('open');});g.classList.add('open');}
  groups.forEach(function(g){
    var grp=document.createElement('div');grp.className='grp';g.grp=grp;
    var head=document.createElement('a');head.className='ghead';head.href='#'+g.h.id;
    var lab=document.createElement('span');lab.className='glabel';lab.textContent=g.label;head.appendChild(lab);
    if(g.kids.length){var c=document.createElement('span');c.className='chev';c.textContent='\u203A';head.appendChild(c);}
    grp.appendChild(head);idx[g.h.id]=head;
    var kids=document.createElement('div');kids.className='gkids';g.kidsEl=kids;
    g.kids.forEach(function(k){var a=document.createElement('a');a.href='#'+k.h.id;a.textContent=k.label;kids.appendChild(a);idx[k.h.id]=a;});
    grp.appendChild(kids);toc.appendChild(grp);head.addEventListener('click',function(){openGroup(grp);});
  });
  if(groups[0])groups[0].grp.classList.add('open');

  // ---- coverage pills on tagged headings (added after TOC so labels stay clean) ----
  content.querySelectorAll('h2[data-own],h3[data-own],h4[data-own]').forEach(function(h){
    var pill=document.createElement('span');pill.className='covpill';
    pill.textContent=h.dataset.own.toUpperCase().replace(/,/g,' \u00b7 ');
    h.appendChild(pill);
  });

  // ---- cert scope filtering ----
  var SETS={cpts:['base','cpts'],cape:['base','cape'],oscp:['base','oscp'],osep:['base','osep'],
            oswe:['base','oswe'],osed:['osed'],all:['base','cpts','cape','oscp','osep','oswe','osed']};
  var BAN={
    cpts:{w:0,t:'CPTS \u00b7 Certified Penetration Testing Specialist',b:'A 10-day engagement graded on methodology and a commercial-grade report; tools are largely unrestricted. Advanced paths not required for CPTS (Kerberos clock-sync, ADCS/relay, delegation chains) are hidden in this scope.'},
    cape:{w:0,t:'CAPE \u00b7 HTB Certified Active Directory Pentesting Expert',b:'10-day exam, internal foothold with <b>no credentials</b>, full AD network; 90 pts via flags + a professional report. Open-book, no stated tool bans. AD-focused: deep enum \u2192 foothold \u2192 lateral movement \u2192 domain privesc \u2192 ADCS/delegation/relay \u2192 modern techniques. This scope = CPTS base + the advanced-AD depth.'},
    oscp:{w:1,t:'OSCP \u00b7 PEN-200 \u2014 exam rules',b:'Metasploit on <b>one</b> machine only, and never for pivoting. Responder poisoning/spoofing is <b>banned</b>. No AI chatbots during exam or reporting. Open-book, proctored.'},
    osep:{w:0,t:'OSEP \u00b7 PEN-300',b:'~48h evasion and AD breach \u2014 you build and chain custom tooling. Scope adds advanced AD, delegation, ADCS, coercion/relay and lateral movement.'},
    oswe:{w:0,t:'OSWE \u00b7 WEB-300',b:'~48h white-box web exploitation \u2014 you must <b>write</b> the exploit. Scope adds source-review-driven chains (SSTI, deserialization, auth-bypass to RCE).'},
    osed:{w:0,t:'OSED \u00b7 EXP-301',b:'Windows user-mode exploit development \u2014 a different domain: WinDbg/IDA, stack &amp; SEH overflows, DEP/ASLR bypass, ROP, custom shellcode. This track is a workflow, not a command cheatsheet.'},
    all:{w:0,t:'ALL \u00b7 full OSCE3 span',b:'Every technique across CPTS \u2192 OSEP/OSWE/OSED. Narrow with the scope selector to focus on one certification.'}
  };
  var banner=document.getElementById('exambanner'),sel2=document.getElementById('certsel'),hint=document.getElementById('scopehint');
  function blockSiblings(h){var lv=+h.tagName[1],els=[h],n=h.nextElementSibling;
    while(n){if(/^H[1-6]$/.test(n.tagName)&&+n.tagName[1]<=lv)break;els.push(n);n=n.nextElementSibling;}return els;}
  function applyView(v){
    if(!SETS[v])v='cpts';var allow=SETS[v];
    content.querySelectorAll('h1,h2,h3,h4').forEach(function(h){
      var cov=(h.dataset.cov||'base').split(',');
      var show=cov.some(function(c){return allow.indexOf(c)>-1;});
      blockSiblings(h).forEach(function(el){el.hidden=!show;});
    });
    groups.forEach(function(g){g.grp.hidden=g.h.hidden;g.kids.forEach(function(k,i){g.kidsEl.children[i].hidden=k.h.hidden;});});
    var ban=BAN[v];banner.hidden=false;banner.className='exam-banner'+(ban.w?' warn':'');
    banner.innerHTML='<span class="et">'+ban.t+'</span>'+ban.b;
    sel2.value=v;document.body.setAttribute('data-scope',v);
    var vis=0;groups.forEach(function(g){if(!g.h.hidden)vis++;});
    hint.textContent=vis+' module'+(vis===1?'':'s')+' in scope';
    try{localStorage.setItem('ua404-scope',v);}catch(e){}
  }
  sel2.addEventListener('change',function(){applyView(sel2.value);scrollTo({top:0,behavior:'smooth'});});
  var startScope='cpts';try{var s=localStorage.getItem('ua404-scope');if(s&&SETS[s])startScope=s;}catch(e){}
  applyView(startScope);

  // ---- search (scoped: [hidden] wins over display, so scope-hidden stays hidden) ----
  var search=document.getElementById('search');
  search.addEventListener('input',function(){var q=search.value.trim().toLowerCase();
    groups.forEach(function(g){var any=false;
      g.kids.forEach(function(k,i){var a=g.kidsEl.children[i];var hit=!q||k.label.toLowerCase().indexOf(q)>-1||g.label.toLowerCase().indexOf(q)>-1;a.style.display=hit?'':'none';if(hit)any=true;});
      var show=!q||g.label.toLowerCase().indexOf(q)>-1||any;g.grp.style.display=show?'':'none';
      if(q)g.grp.classList.toggle('open',any||g.label.toLowerCase().indexOf(q)>-1);});});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==search){e.preventDefault();search.focus();}
    if(e.key==='Escape'){search.value='';search.dispatchEvent(new Event('input'));search.blur();}});

  // ---- scrollspy ----
  var obs=new IntersectionObserver(function(ents){ents.forEach(function(en){if(en.isIntersecting){
    toc.querySelectorAll('.active').forEach(function(x){x.classList.remove('active')});
    var a=idx[en.target.id];if(a){a.classList.add('active');if(!search.value){var g=a.closest('.grp');if(g)openGroup(g);}a.scrollIntoView({block:'nearest'});}}});},
    {rootMargin:'-70px 0px -75% 0px'});
  nodes.forEach(function(h){obs.observe(h);});

  // ---- drawer + back to top ----
  var side=document.getElementById('side'),scrim=document.getElementById('scrim');
  function openSide(v){side.classList.toggle('open',v);scrim.classList.toggle('open',v);}
  document.getElementById('menuBtn').addEventListener('click',function(){openSide(!side.classList.contains('open'));});
  scrim.addEventListener('click',function(){openSide(false);});
  toc.addEventListener('click',function(e){var a=e.target.closest('a');if(a&&a.parentElement.classList.contains('gkids')&&innerWidth<=860)openSide(false);});
  var bt=document.getElementById('backtop');addEventListener('scroll',function(){bt.style.display=scrollY>600?'block':'none';});
  bt.addEventListener('click',function(){scrollTo({top:0,behavior:'smooth'});});
})();
</script>
<script src="assets/app.js"></script>
</body>
</html>
